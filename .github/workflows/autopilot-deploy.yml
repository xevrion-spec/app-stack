name: autopilot-deploy
on: { workflow_dispatch: {} }   # manual only
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx wrangler d1 migrations apply autopilot-db --remote
        working-directory: autopilot/apps/api
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - run: npx wrangler deploy
        working-directory: autopilot/apps/api
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - run: npm run build -w apps/web   # web assets now come from Vite (dist/)
      - run: npx wrangler deploy
        working-directory: autopilot/apps/web
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
