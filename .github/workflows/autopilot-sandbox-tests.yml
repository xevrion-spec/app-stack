name: autopilot-sandbox-tests
on:
  push: { paths: ["autopilot/packages/sandbox/**", ".github/workflows/autopilot-sandbox-tests.yml"] }
jobs:
  mocked:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install daytona
      - run: python packages/sandbox/tests/test_guard.py   # mocked only, no API key, no credit
