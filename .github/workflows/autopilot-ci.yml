name: autopilot-ci
on:
  push: { paths: ["autopilot/**", ".github/workflows/autopilot-*.yml"] }
  pull_request: { paths: ["autopilot/**"] }
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - name: Type check (strict)
        run: npm run typecheck
      - name: ESLint + Prettier
        run: npm run lint
      - name: Unit, property and integration tests with coverage gate
        run: npm run coverage
      - name: OpenAPI + SDK drift gate
        run: npm run openapi:check
  evals-gate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: autopilot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r local/requirements.txt
      - run: python evals/run_evals.py --offline --threshold 0.6
