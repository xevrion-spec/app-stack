name: autopilot-ci
on:
  push: { paths: ["autopilot/**", ".github/workflows/autopilot-*.yml"] }
  pull_request: { paths: ["autopilot/**"] }
  schedule: [{ cron: "17 3 * * *" }] # nightly full mutation run
permissions: { contents: read }
concurrency: { group: "autopilot-ci-${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { working-directory: autopilot } }
jobs:
  static:
    name: Types, lint, complexity, dead code, cycles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: ESLint (incl. complexity <= 20, max-depth 4, max-params 6, fn <= 150 lines) + Prettier
        run: npm run lint
      - name: knip (unused files, exports, dependencies)
        run: npm run knip
      - name: madge (no circular imports)
        run: npm run madge
      - name: OpenAPI + SDK drift gate
        run: npm run openapi:check
  tests:
    name: Unit, property, integration, RTL (coverage >= 90/85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - run: npm run coverage
      - name: Golden evals gate (TS pipeline, offline rules-only, >= 0.90)
        run: npm run evals -- --threshold 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-and-evals, path: "autopilot/coverage/coverage-summary.json\nautopilot/evals/results/ts-latest.json", retention-days: 14 }
  supply-chain:
    name: npm audit, licences, gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - name: npm audit (production deps, high+ fails)
        run: npm run audit:prod
      - name: npm audit (all deps, report only)
        run: npm audit --audit-level=high || true
      - name: Licence allow-list
        run: npm run licenses
      - name: gitleaks (full history)
        working-directory: .
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config autopilot/.gitleaks.toml --redact --no-banner
  mutation:
    name: Stryker (ledger, VAT, categoriser, automation engine, webhooks; break < 70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - uses: actions/cache@v4
        with: { path: autopilot/reports/stryker-incremental.json, key: "stryker-${{ github.ref }}-${{ github.sha }}", restore-keys: "stryker-${{ github.ref }}-" }
      - run: npx stryker run --incremental --incrementalFile reports/stryker-incremental.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mutation-report, path: autopilot/reports/mutation, retention-days: 14 }
  web:
    name: Web build, bundle budget, Lighthouse CI, Playwright + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Bundle budget (gzip js <= 80 KB, css <= 10 KB)
        run: npm run bundle:budget
      - name: Lighthouse CI (perf >= 0.9, a11y >= 0.95)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ hashFiles('autopilot/package-lock.json') }}" }
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke + axe (local API on SQLite, synthetic data)
        run: npm run e2e -w apps/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: autopilot/apps/web/test-results, retention-days: 7 }
  perf:
    name: Load test (local API, synthetic data, read p95 <= 250 ms)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: autopilot/package-lock.json }
      - run: npm ci
      - name: 10k-transaction pipeline perf (isolated, strict budgets)
        run: PERF=1 npx vitest run apps/api/test/reliability.test.ts -t performance
      - run: |
          RATE_LIMIT_PER_MINUTE=10000000 npx tsx apps/api/dev/local-server.ts &
          npx --yes wait-on -t 60000 http://127.0.0.1:8787/health
          npm run load -- --duration 20 --concurrency 16 --p95 250
  evals-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r local/requirements.txt
      - run: python evals/run_evals.py --offline --threshold 0.6
