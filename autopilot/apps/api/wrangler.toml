name = "autopilot-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "api.xevrion.co.uk", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://app.xevrion.co.uk"
ACCESS_TEAM_DOMAIN = "" # set to <team>.cloudflareaccess.com before deploy
ACCESS_AUD = ""         # Access application AUD tag; production rejects requests when unset

[[d1_databases]]
binding = "DB"
database_name = "autopilot-db"
database_id = "1f882884-8f22-4b89-ac01-438a5b2c6f47"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "autopilot-documents"

[[kv_namespaces]]
binding = "CONFIG"
id = "cdf2a12ce4644bce9d9f6a366da05a9a"

[[queues.producers]]
binding = "PIPELINE"
queue = "autopilot-pipeline"

[[queues.consumers]]
queue = "autopilot-pipeline"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "autopilot-pipeline-dlq"

# DLQ consumer: marks jobs failed and raises a JOB_FAILED exception (see src/queue.ts).
# The queue autopilot-pipeline-dlq must exist before the next (manual) deploy.
[[queues.consumers]]
queue = "autopilot-pipeline-dlq"
max_batch_size = 10
max_retries = 1

[observability]
enabled = true

# Realtime: one Durable Object per tenant (SSE + WebSocket fan-out). Requires a migration tag on first deploy.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "TenantRealtime"

[[migrations]]
tag = "v1-realtime"
new_sqlite_classes = ["TenantRealtime"]

# Outbox sweeper + webhook retries.
[triggers]
crons = ["* * * * *"]

# ---------------------------------------------------------------------------
# TEST deployment (synthetic data only). Separate resources; never touches production.
# Not public: no route and workers_dev = false; reached only via the autopilot-web-test service binding,
# whose workers.dev host sits behind the existing Cloudflare Access "All Workers" app.
# ACCESS_TEAM_DOMAIN and ACCESS_AUD are set as Worker secrets (wrangler secret put --env staging), not here.
# ENVIRONMENT = "staging" fails closed: x-dev-user is ignored, a valid Access JWT is required.
[env.staging]
name = "autopilot-api-test"
workers_dev = false
routes = []

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://autopilot-web-test.henrydavenhall124.workers.dev"
RATE_LIMIT_PER_MINUTE = "600"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "autopilot-test-db"
database_id = "a026af48-0804-4a6b-9a6a-48ce1b88ef9b"
migrations_dir = "../../migrations"

[[env.staging.r2_buckets]]
binding = "DOCS"
bucket_name = "autopilot-test-documents"

[[env.staging.kv_namespaces]]
binding = "CONFIG"
id = "fbe03fc8e35042a4a767cf1363ac6601"

[[env.staging.queues.producers]]
binding = "PIPELINE"
queue = "autopilot-test-pipeline"

[[env.staging.queues.consumers]]
queue = "autopilot-test-pipeline"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "autopilot-test-pipeline-dlq"

[[env.staging.queues.consumers]]
queue = "autopilot-test-pipeline-dlq"
max_batch_size = 10
max_retries = 1

[[env.staging.durable_objects.bindings]]
name = "REALTIME"
class_name = "TenantRealtime"

# Hourly (not every minute) to stay well inside free-plan D1 read limits.
[env.staging.triggers]
crons = ["0 * * * *"]
