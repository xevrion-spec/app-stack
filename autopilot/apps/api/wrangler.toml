name = "autopilot-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "api.xevrion.co.uk", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://app.xevrion.co.uk"
ACCESS_TEAM_DOMAIN = "" # set to <team>.cloudflareaccess.com before deploy
ACCESS_AUD = ""         # Access application AUD tag; production rejects requests when unset

[[d1_databases]]
binding = "DB"
database_name = "autopilot-db"
database_id = "1f882884-8f22-4b89-ac01-438a5b2c6f47"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "autopilot-documents"

[[kv_namespaces]]
binding = "CONFIG"
id = "cdf2a12ce4644bce9d9f6a366da05a9a"

[[queues.producers]]
binding = "PIPELINE"
queue = "autopilot-pipeline"

[[queues.consumers]]
queue = "autopilot-pipeline"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "autopilot-pipeline-dlq"

# DLQ consumer: marks jobs failed and raises a JOB_FAILED exception (see src/queue.ts).
# The queue autopilot-pipeline-dlq must exist before the next (manual) deploy.
[[queues.consumers]]
queue = "autopilot-pipeline-dlq"
max_batch_size = 10
max_retries = 1

[observability]
enabled = true
